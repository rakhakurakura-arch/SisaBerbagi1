</head>

<body>

      <svg class="icon-brand" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"

      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"

    </div>
  </nav>

  <div class="container" style="max-width:560px;">
    <div class="page-header">
      <h1>Daftar Sebagai Mitra</h1>
      <p>Buat profil mitra sekali saja — data kamu tersimpan & bisa dipakai berkali-kali tanpa isi ulang tiap kali input/klaim makanan.</p>
    </div>

    <div class="card">
      <form id="registrasiForm">

        <div class="form-group">
          <label>Daftar Sebagai</label>
          <div class="role-toggle">
            <label class="role-option">
              <input type="radio" name="jenisMitra" value="restoran" checked>
              <span>🍱 Restoran / Toko</span>
            </label>
            <label class="role-option">
              <input type="radio" name="jenisMitra" value="penerima">
              <span>🏠 Panti / Komunitas</span>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="namaMitra">Nama Restoran/Toko atau Panti/Komunitas</label>
          <input type="text" id="namaMitra" placeholder="Contoh: Dapur Berkah Sentosa" required>
        </div>

        <div class="form-group">
          <label for="kontakMitra">Nomor WhatsApp Aktif (dipakai untuk login)</label>
          <input type="tel" id="kontakMitra" placeholder="Contoh: 081234567890" required>
        </div>

        <div class="form-group">
          <label for="alamatMitra">Alamat Lengkap</label>
          <input type="text" id="alamatMitra" placeholder="Contoh: Jl. Mawar No. 12, Kel. Tebet, Jakarta" required>
        </div>

        <div class="form-group">
          <label for="jiwaDilayani">Perkiraan Jumlah Jiwa/Orang yang Dilayani Rutin (khusus Panti/Komunitas, opsional)</label>
          <input type="number" id="jiwaDilayani" min="1" placeholder="Contoh: 40">
        </div>

        <div class="form-group">
          <label>Lokasi Peta (Opsional, membantu fitur jarak & peta mitra)</label>
          <button type="button" id="btnAmbilLokasi" class="btn-secondary">
            📍 Gunakan Lokasi Saya Sekarang
          </button>
          <div id="lokasiStatus" class="lokasi-status"></div>
          <input type="hidden" id="mitraLat">
          <input type="hidden" id="mitraLng">
        </div>

        <div class="form-group">
          <label for="pinMitra">Buat PIN Login (4-6 digit angka)</label>
          <input type="password" id="pinMitra" inputmode="numeric" pattern="[0-9]{4,6}" minlength="4" maxlength="6"
            placeholder="Contoh: 1234" required>
        </div>

        <div class="form-group">
          <label for="pinKonfirmasi">Ulangi PIN</label>
          <input type="password" id="pinKonfirmasi" inputmode="numeric" pattern="[0-9]{4,6}" minlength="4"
            maxlength="6" placeholder="Ulangi PIN yang sama" required>
        </div>

        <div class="form-group">
          <label for="captchaAnswerReg">Verifikasi Keamanan (CAPTCHA): <span id="captchaQuestionReg"
              style="font-weight:700; color:var(--primary-dark); margin-left:4px;"></span></label>
          <input type="number" id="captchaAnswerReg" placeholder="Masukkan angka jawaban" required>
        </div>

        <div id="regErrorBox" class="error-box" style="display:none;"></div>

        <button type="submit" id="btnDaftar" class="btn-primary">Daftar & Masuk</button>
      </form>

      <p class="auth-switch">Sudah punya profil mitra? <a href="login.html">Login di sini</a></p>
    </div>
  </div>

  <script type="module" src="registrasi.js"></script>
  <script src="navbar.js"></script>
</body>
