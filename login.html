<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="restoran.css">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="chatbot.css">
</head>

<body>

  <nav class="navbar">
    <a href="index.html" class="brand">
      <svg class="icon-brand" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" />
        <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" />
      </svg>
      <span>SisaBerbagi</span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Menu Navigasi">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Beranda</a>
      <a href="restoran.html" class="nav-link">Restoran / Toko</a>
      <a href="penerima.html" class="nav-link">Penerima / Panti</a>
      <a href="peta.html" class="nav-link">Peta Mitra</a>
      <a href="riwayat.html" class="nav-link">Riwayat Penyaluran</a>
      <a href="tentang.html" class="nav-link">Tentang Kami</a>
      <a href="login.html" class="nav-link active">Login Mitra</a>
    </div>
  </nav>

  <div class="container" style="max-width:460px;">
    <div class="page-header">
      <h1>Login Mitra</h1>
      <p>Masuk pakai nomor WhatsApp & PIN yang kamu buat saat registrasi.</p>
    </div>

    <div class="card">
      <form id="loginForm">
        <div class="form-group">
          <label for="loginWA">Nomor WhatsApp</label>
          <input type="tel" id="loginWA" placeholder="Contoh: 081234567890" required>
        </div>

        <div class="form-group">
          <label for="loginPin">PIN</label>
          <input type="password" id="loginPin" inputmode="numeric" pattern="[0-9]{4,6}" placeholder="PIN kamu" required>
        </div>

        <div id="loginErrorBox" class="error-box" style="display:none;"></div>

        <button type="submit" id="btnLogin" class="btn-primary">Masuk</button>
      </form>

      <p class="auth-switch">Belum punya profil mitra? <a href="registrasi.html">Daftar di sini</a></p>
    </div>
  </div>

  <script type="module" src="login.js"></script>
  <script src="navbar.js"></script>
</body>

</html>
